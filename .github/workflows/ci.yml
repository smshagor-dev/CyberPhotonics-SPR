name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[io,onnx,dev]"
      - run: python -m compileall -q src main.py scripts
      - run: ruff check --select E9,F63,F7,F82 src tests main.py scripts
      - run: pytest -q
