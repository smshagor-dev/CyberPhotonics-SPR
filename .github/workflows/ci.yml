name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install native Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install core test dependencies
        run: pip install -e ".[dev,onnx]"
      - name: Ruff fatal checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Compile
        run: python -m compileall -q src main.py scripts
      - name: Verify critical imports
        run: python -c "import main; import sprpcf.ml.active_learning; import sprpcf.ml.explainability; import sprpcf.ml.export_onnx; import sprpcf.publication.evidence; import sprpcf.publication.submission; import sprpcf.simulation.comsol_sweep; import sprpcf.utils.readiness"
      - name: Validate research release metadata
        if: matrix.python-version == '3.11'
        run: python scripts/verify_release.py --expected-version 1.0.0rc1
      - name: Whole-system release readiness gate
        if: matrix.python-version == '3.11'
        run: |
          python scripts/check_system_readiness.py \
            --profile release \
            --expected-version 1.0.0rc1 \
            --json-out /tmp/system-readiness.json \
            --markdown-out /tmp/system-readiness.md \
            --strict
      - name: Reviewer package CLI smoke test
        if: matrix.python-version == '3.11'
        run: |
          python scripts/build_reviewer_package.py \
            --out /tmp/reviewer-smoke \
            --title "CI Reviewer Package Smoke Test" \
            --no-release-metadata
          test -f /tmp/reviewer-smoke/REVIEWER_GUIDE.md
          test -f /tmp/reviewer-smoke/CLAIMS_MATRIX.md
          test -f /tmp/reviewer-smoke/checksums.sha256
      - name: Build polished publication and submission demo
        if: matrix.python-version == '3.11'
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/run_publication_demo.py \
            --out /tmp/publication-demo \
            --samples 24 \
            --wavelengths 128 \
            --bootstrap-resamples 500 \
            --seed 7
          test -f /tmp/publication-demo/DEMO_INDEX.html
          test -f /tmp/publication-demo/reviewer_package/manifest.json
          test -f /tmp/publication-demo/submission_package/SUPPLEMENTARY_INFORMATION.md
          test -f /tmp/publication-demo/submission_package/TABLE_S1_VALIDATION_METRICS.csv
          test -f /tmp/publication-demo/submission_package/submission_checksums.sha256
      - name: Upload publication demo artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: publication-demo-${{ github.sha }}
          if-no-files-found: error
          path: /tmp/publication-demo/
      - name: Build wheel and source distribution
        if: matrix.python-version == '3.11'
        run: python -m build
      - name: Smoke-test built wheel in isolated environment
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'sprpcf-*.whl' -print -quit)
          test -n "$wheel"
          python scripts/smoke_test_wheel.py "$wheel" \
            --expected-version 1.0.0rc1 \
            --json-out /tmp/wheel-smoke.json
      - name: Upload system readiness evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: system-readiness-${{ github.sha }}
          if-no-files-found: error
          path: |
            /tmp/system-readiness.json
            /tmp/system-readiness.md
            /tmp/wheel-smoke.json
      - name: Core tests (warnings are errors)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -W error --ignore=tests/test_edge_deployment.py --ignore=tests/test_full_pipeline.py

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install native desktop test dependencies
        run: pip install -e ".[dev]"
      - name: Native desktop render and launcher tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -W error tests/test_desktop_gui.py tests/test_main_dashboard_default.py

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dashboard dependencies
        run: pip install -e ".[dev,dashboard]"
      - name: Import dashboard app
        env:
          MPLBACKEND: Agg
        run: python -c "import sprpcf.dashboard.app"
      - name: Dashboard tests (warnings are errors)
        env:
          MPLBACKEND: Agg
        run: pytest -q -W error tests/test_dashboard.py

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install edge test dependencies
        run: pip install -e ".[dev,edge,onnx]"
      - name: Edge and end-to-end tests (warnings are errors)
        env:
          CUDA_VISIBLE_DEVICES: "-1"
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: pytest -q -W error tests/test_edge_deployment.py tests/test_full_pipeline.py
