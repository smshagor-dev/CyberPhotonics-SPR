name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install native Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install core test dependencies
        run: pip install -e ".[dev,onnx]"
      - name: Ruff fatal checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Compile
        run: python -m compileall -q src main.py scripts
      - name: Verify critical imports
        run: python -c "import main; import sprpcf.ml.active_learning; import sprpcf.ml.explainability; import sprpcf.ml.export_onnx; import sprpcf.publication.evidence; import sprpcf.publication.submission; import sprpcf.simulation.comsol_sweep; import sprpcf.utils.readiness"
      - name: Validate research release metadata
        if: matrix.python-version == '3.11'
        run: python scripts/verify_release.py --expected-version 1.0.0rc1
      - name: Whole-system release readiness gate
        if: matrix.python-version == '3.11'
        run: |
          python scripts/check_system_readiness.py \
            --profile release \
            --expected-version 1.0.0rc1 \
            --json-out /tmp/system-readiness.json \
            --markdown-out /tmp/system-readiness.md \
            --strict
      - name: Reviewer package CLI smoke test
        if: matrix.python-version == '3.11'
        run: |
          python scripts/build_reviewer_package.py \
            --out /tmp/reviewer-smoke \
            --title "CI Reviewer Package Smoke Test" \
            --no-release-metadata
          test -f /tmp/reviewer-smoke/REVIEWER_GUIDE.md
          test -f /tmp/reviewer-smoke/CLAIMS_MATRIX.md
          test -f /tmp/reviewer-smoke/checksums.sha256
      - name: Build polished publication and submission demo
        if: matrix.python-version == '3.11'
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/run_publication_demo.py \
            --out /tmp/publication-demo \
            --samples 24 \
            --wavelengths 128 \
            --bootstrap-resamples 500 \
            --seed 7
          test -f /tmp/publication-demo/DEMO_INDEX.html
          test -f /tmp/publication-demo/reviewer_package/manifest.json
          test -f /tmp/publication-demo/submission_package/SUPPLEMENTARY_INFORMATION.md
          test -f /tmp/publication-demo/submission_package/TABLE_S1_VALIDATION_METRICS.csv
          test -f /tmp/publication-demo/submission_package/submission_checksums.sha256
      - name: Generate conservative evidence inventory
        if: matrix.python-version == '3.11'
        run: |
          python scripts/evidence_inventory.py \
            --json-out /tmp/evidence-inventory.json \
            --markdown-out /tmp/evidence-inventory.md
          python -c "import json; d=json.load(open('/tmp/evidence-inventory.json')); assert d['scientific_submission_ready'] is False; assert d['schema_version'] == 1"
      - name: Upload evidence inventory report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: research-evidence-inventory-${{ github.sha }}
          if-no-files-found: error
          path: |
            /tmp/evidence-inventory.json
            /tmp/evidence-inventory.md
      - name: Run grouped statistical validation (software-only)
        if: matrix.python-version == '3.11'
        run: |
          python scripts/generate_synthetic_dataset.py \
            --samples 16 --wavelengths 48 --seed 7 \
            --out /tmp/stage3_synthetic.csv
          python scripts/run_grouped_ml_study.py \
            --data /tmp/stage3_synthetic.csv \
            --out /tmp/stage3_grouped_ml \
            --seeds 7,17 --trees 8 --bootstrap-resamples 200 \
            --allow-software-only
          python -c "import json; p=json.load(open('/tmp/stage3_grouped_ml/STUDY_MANIFEST.json')); assert p['source']['evidence_class']=='software_only'; assert p['publication_ready'] is False; assert p['observations']['unique_geometry_groups']==16"
      - name: Upload grouped ML validation tables
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: grouped-ml-validation-${{ github.sha }}
          if-no-files-found: error
          path: /tmp/stage3_grouped_ml/

      - name: Train and benchmark inverse design (software-only)
        if: matrix.python-version == '3.11'
        run: |
          python -m sprpcf.ml.train_tandem \
            --data /tmp/stage3_synthetic.csv \
            --device cpu --epochs 1 --batch-size 32 --seed 7 \
            --out /tmp/stage4_tandem.pt --onnx-out /tmp/stage4_tandem.onnx
          python scripts/run_inverse_benchmark.py \
            --data /tmp/stage3_synthetic.csv \
            --checkpoint /tmp/stage4_tandem.pt \
            --out /tmp/stage4_inverse_benchmark \
            --seeds 7,17 --candidates-per-target 4 \
            --bootstrap-resamples 200 --allow-software-only
          python -c "import json; d=json.load(open('/tmp/stage4_inverse_benchmark/INVERSE_BENCHMARK_MANIFEST.json')); assert d['evidence_class']=='software_only'; assert d['scientific_submission_ready'] is False; assert d['physics_solver_evaluations']==0; assert d['heldout_geometry_groups']>=3"
      - name: Upload inverse design comparison artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: inverse-design-benchmark-${{ github.sha }}
          if-no-files-found: error
          path: /tmp/stage4_inverse_benchmark/

      - name: Verify physics-evidence gate fails closed without real COMSOL
        if: matrix.python-version == '3.11'
        run: |
          set +e
          python scripts/verify_inverse_comsol.py \
            --benchmark /tmp/stage4_inverse_benchmark \
            --solver-archive /tmp/no-real-comsol-archive \
            --refinement-archive /tmp/no-real-refinement-archive \
            --out /tmp/stage5_unqualified_report \
            --bootstrap-resamples 200 --strict
          code=$?
          set -e
          test "$code" -eq 2
          python -c "import json; r=json.load(open('/tmp/stage5_unqualified_report/PHYSICS_VERIFICATION_AUDIT.json')); assert r['numerical_archive_consistent'] is False; assert r['source_authenticity_verified'] is False; assert r['scientific_submission_ready'] is False; assert len(r['errors'])>0"
      - name: Upload scientific blocker evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: unqualified-physics-blockers-${{ github.sha }}
          if-no-files-found: error
          path: /tmp/stage5_unqualified_report/

      - name: Generate fail-closed Stage 6 claim package
        if: matrix.python-version == '3.11'
        run: |
          python scripts/build_claim_evidence_package.py \
            --benchmark /tmp/stage4_inverse_benchmark \
            --stage5 /tmp/stage5_unqualified_report \
            --out /tmp/stage6_claim_evidence
          python -c "import json,csv; from pathlib import Path; root=Path('/tmp/stage6_claim_evidence'); d=json.loads((root/'PUBLICATION_EVIDENCE_MANIFEST.json').read_text()); assert d['scientific_submission_ready'] is False; assert d['numerical_candidates_available'] is False; assert d['candidate_number_count']==0; assert len(list(csv.DictReader((root/'CANDIDATE_NUMERICAL_VALUES_FOR_REVIEW.csv').open())))==0"
      - name: Upload Stage 6 research claim gap package
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: stage6-claim-evidence-${{ github.sha }}
          if-no-files-found: error
          path: /tmp/stage6_claim_evidence/

      - name: Preregister Stage 7 COMSOL requests (fixture only)
        if: matrix.python-version == '3.11'
        run: |
          python -c "from pathlib import Path; Path('/tmp/stage7_DUMMY_NOT_COMSOL.mph').write_bytes(b'TEST FIXTURE ONLY - NOT A COMSOL MODEL')"
          python scripts/run_comsol_verification_campaign.py plan \
            --benchmark /tmp/stage4_inverse_benchmark \
            --model /tmp/stage7_DUMMY_NOT_COMSOL.mph \
            --config configs/comsol_sweep.example.yaml \
            --solver-version 'TEST_FIXTURE_NO_COMSOL_RUN' \
            --ri-span 0.04 --ri-points 5 \
            --sensitivity-scale 100 --fom-scale 10 --resonance-scale 20 \
            --out /tmp/stage7_fixture_plan
          python -c "import json,csv; from pathlib import Path; p=Path('/tmp/stage7_fixture_plan'); d=json.loads((p/'campaign_plan.json').read_text()); r=list(csv.DictReader((p/'planned_sweeps.csv').open())); assert len(r)==d['planned_solver_evaluations']==d['planned_request_count']*5; assert d['physical_source_authenticity_verified'] is False; assert not (p/'sweeps.csv').exists()"
      - name: Upload pre-registered Stage 7 software-only plan
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: stage7-software-fixture-plan-${{ github.sha }}
          if-no-files-found: error
          path: /tmp/stage7_fixture_plan/

      - name: Verify COMSOL interruption and resume (software fixtures only)
        if: matrix.python-version == '3.11'
        run: |
          pytest -q -W error tests/test_resumable_campaign.py
      - name: Verify multi-session native COMSOL log evidence (software fixtures only)
        if: matrix.python-version == '3.11'
        run: |
          pytest -q -W error tests/test_resumable_campaign.py -k "session or log or sealing"
      - name: Confirm no COMSOL execution was claimed by the fixture plan
        if: matrix.python-version == '3.11'
        run: |
          python -c "import json; from pathlib import Path; p=Path('/tmp/stage7_fixture_plan'); assert (p/'campaign_plan.json').is_file(); m=json.loads((p/'campaign_plan.json').read_text()); assert m['physical_source_authenticity_verified'] is False; assert not (p/'sweeps.csv').exists()"

      - name: Upload publication demo artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: publication-demo-${{ github.sha }}
          if-no-files-found: error
          path: /tmp/publication-demo/
      - name: Build wheel and source distribution
        if: matrix.python-version == '3.11'
        run: python -m build
      - name: Smoke-test built wheel in isolated environment
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'sprpcf-*.whl' -print -quit)
          test -n "$wheel"
          python scripts/smoke_test_wheel.py "$wheel" \
            --expected-version 1.0.0rc1 \
            --json-out /tmp/wheel-smoke.json
      - name: Upload system readiness evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: system-readiness-${{ github.sha }}
          if-no-files-found: error
          path: |
            /tmp/system-readiness.json
            /tmp/system-readiness.md
            /tmp/wheel-smoke.json
      - name: Core tests (warnings are errors)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -W error --ignore=tests/test_edge_deployment.py --ignore=tests/test_full_pipeline.py

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install native desktop test dependencies
        run: pip install -e ".[dev]"
      - name: Native desktop render and launcher tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -W error tests/test_desktop_gui.py tests/test_main_dashboard_default.py

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dashboard dependencies
        run: pip install -e ".[dev,dashboard]"
      - name: Import dashboard app
        env:
          MPLBACKEND: Agg
        run: python -c "import sprpcf.dashboard.app"
      - name: Dashboard tests (warnings are errors)
        env:
          MPLBACKEND: Agg
        run: pytest -q -W error tests/test_dashboard.py

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install edge test dependencies
        run: pip install -e ".[dev,edge,onnx]"
      - name: Edge and end-to-end tests (warnings are errors)
        env:
          CUDA_VISIBLE_DEVICES: "-1"
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: pytest -q -W error tests/test_edge_deployment.py tests/test_full_pipeline.py
