name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev,edge,onnx]"
      - name: Ruff fatal checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Compile
        run: python -m compileall -q src main.py scripts
      - name: Tests
        run: pytest -q
