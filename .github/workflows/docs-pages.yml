name: Documentation Site

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-docs-site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate static site entry points
        run: |
          test -s docs/index.html
          test -s docs/site.css
          test -s docs/assets/cyberphotonics-spr-code-layout.svg
          grep -q "CyberPhotonics-SPR" docs/index.html
          grep -q "site.css" docs/index.html

  deploy:
    name: deploy-pages
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload documentation site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
