name: Checkpoint Hardening Once

on:
  push:
    branches: [chore/governance-hardening-final]
    paths:
      - ".github/workflows/checkpoint-hardening-once.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/governance-hardening-final
      - name: Apply checkpoint hardening migration
        run: python scripts/checkpoint_hardening_migration.py
      - name: Commit hardening and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): use weights-only checkpoint loading"
          git push origin HEAD:chore/governance-hardening-final
