name: Fix README math macros

on:
  push:
    paths:
      - '.github/workflows/fix-readme-math.yml'

permissions:
  contents: write

jobs:
  fix-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Replace unsupported GitHub math macros
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              r'\operatorname{mean}': r'\mathrm{mean}',
              r'\operatorname{ReLU}': r'\mathrm{ReLU}',
              r'\operatorname{clip}': r'\mathrm{clip}',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if r'\operatorname{' in text:
              raise SystemExit('Unsupported \\operatorname macro still present in README.md')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit README fix
        run: |
          if git diff --quiet -- README.md; then
            echo "README already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: replace unsupported GitHub math macros"
          git push origin HEAD:main
