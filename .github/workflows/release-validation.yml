name: Research Release Validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install release dependencies
        run: pip install -e ".[dev,onnx]"
      - name: Validate release metadata
        shell: bash
        run: |
          args=(--json-out release-validation.json)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--expected-version "${GITHUB_REF_NAME#v}")
          fi
          python scripts/verify_release.py "${args[@]}"
      - name: Whole-system release readiness gate
        shell: bash
        run: |
          args=(--profile release --json-out release-readiness.json --markdown-out release-readiness.md --strict)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--expected-version "${GITHUB_REF_NAME#v}")
          fi
          python scripts/check_system_readiness.py "${args[@]}"
      - name: Core tests with warnings as errors
        run: pytest -q -W error --ignore=tests/test_edge_deployment.py --ignore=tests/test_full_pipeline.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke-test built wheel
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'sprpcf-*.whl' -print -quit)
          test -n "$wheel"
          expected=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected="${GITHUB_REF_NAME#v}"
          fi
          if [[ -n "$expected" ]]; then
            python scripts/smoke_test_wheel.py "$wheel" --expected-version "$expected" --json-out wheel-smoke.json
          else
            python scripts/smoke_test_wheel.py "$wheel" --json-out wheel-smoke.json
          fi
      - name: Capture release environment
        run: |
          python scripts/create_reproducibility_bundle.py \
            --out release-evidence \
            --name "release-${GITHUB_REF_NAME}" \
            --seed 0
      - name: Build publication demo, reviewer package, and submission package
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/run_publication_demo.py \
            --out publication-demo \
            --samples 24 \
            --wavelengths 128 \
            --bootstrap-resamples 500 \
            --seed 7
          test -f publication-demo/submission_package/submission_manifest.json
          test -f publication-demo/submission_package/submission_checksums.sha256
      - name: Build release reviewer index
        run: |
          python scripts/build_reviewer_package.py \
            --out release-reviewer-package \
            --title "CyberPhotonics-SPR Release Reviewer Package" \
            --reproducibility-dir release-evidence \
            --release-validation release-validation.json
      - name: Build release-candidate submission archive
        run: |
          python scripts/build_submission_package.py \
            --reviewer-package publication-demo/reviewer_package \
            --validation-dir publication-demo/validation \
            --out release-submission-package \
            --title "CyberPhotonics-SPR Release Candidate Submission Package" \
            --journal "venue not specified"
      - uses: actions/upload-artifact@v4
        with:
          name: research-release-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/
            release-validation.json
            release-readiness.json
            release-readiness.md
            wheel-smoke.json
            release-evidence/
            release-reviewer-package/
            release-submission-package/
            publication-demo/

  edge-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install edge dependencies
        run: pip install -e ".[dev,edge,onnx]"
      - name: Edge and end-to-end tests with warnings as errors
        env:
          CUDA_VISIBLE_DEVICES: "-1"
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: pytest -q -W error tests/test_edge_deployment.py tests/test_full_pipeline.py
