name: Source-bound analytical Au planar reference (not PCF)
on:
  pull_request:
    paths:
      - '.github/workflows/sourced-planar-au-reference.yml'
      - 'src/sprpcf/simulation/planar_spp_sweep.py'
      - 'src/sprpcf/simulation/materials_reference.py'
      - 'src/sprpcf/simulation/data/au_johnson_christy_1972.csv'
      - 'tests/test_sourced_planar_spp.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source material dependencies
        run: python -m pip install numpy
      - name: Execute real measured-reference Au source regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_sourced_planar_spp.py -v
      - name: Execute native source-linked nine-point analytical reference
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          from sprpcf.simulation.planar_spp_sweep import run_sourced_sweep
          out = pathlib.Path('/tmp/planar-au-reference/planar_reference.json')
          digest = run_sourced_sweep([.75,.8,.85], [1.35,1.36,1.37], out)
          raw = out.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == digest
          obj = json.loads(raw)
          assert len(obj['rows']) == 9 and obj['failure_count'] == 0
          assert obj['gold']['source_doi'] == 'https://doi.org/10.1103/PhysRevB.6.4370'
          assert all(row['normalized_tm_boundary_residual'] < 1e-9 for row in obj['rows'])
          assert all(not obj[k] for k in ('physics_qualified','publication_ready','comsol_verified'))
          (out.parent/'SHA256SUMS').write_text(f'{digest}  planar_reference.json\n')
          print('Analytical planar reference executed; NOT PCF FEM/COMSOL or sensor evidence', digest)
          PY
      - name: Verify SHA256SUMS with standard checksum parser
        run: cd /tmp/planar-au-reference && sha256sum --check SHA256SUMS
      - name: Preserve native source-linked analytical outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-au-planar-analytical-unqualified
          path: /tmp/planar-au-reference/
          if-no-files-found: warn
