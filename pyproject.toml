[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprpcf"
version = "0.2.0"
description = "ML-driven inverse design and edge denoising for PCF-SPR sensors"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.1", "pyyaml>=6.0", "tqdm>=4.66"]

[project.optional-dependencies]
io = ["pyarrow>=14.0"]
onnx = ["onnx>=1.15", "onnxscript>=0.1.0", "onnxruntime>=1.16"]
edge = ["tensorflow>=2.14"]
comsol = ["mph>=1.2"]
xai = ["matplotlib>=3.7", "shap>=0.45"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
