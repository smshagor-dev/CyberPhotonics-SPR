[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprpcf"
version = "1.0.0rc1"
description = "Publication-grade research framework for PCF-SPR simulation, inverse design, validation, and edge inference"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=14",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "torch>=2.1",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
edge = [
  "tensorflow-cpu>=2.14; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "tensorflow>=2.14; platform_system != 'Linux' or platform_machine != 'x86_64'",
  "ai-edge-litert>=2.2,<3",
]
hardware = ["pyserial>=3.5"]
onnx = ["onnx>=1.15", "onnxscript>=0.1.0", "onnxruntime>=1.16"]
comsol = ["mph>=1.2"]
xai = ["shap>=0.45"]
dashboard = ["streamlit>=1.40,<2"]
dev = ["pytest>=7.4", "ruff>=0.6", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
